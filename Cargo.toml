[package]
name = "sn-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
dashmap = "6.2.1"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "with_axum"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
hkdf = "0.13.0"
ipnet = "2.12.0"
md-5 = "0.11.0"
p12-keystore = "0.1"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
rocksdb = "0.24.0"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
socket2 = "0.6.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4"] }

# Unix-only: setsid() in the daemonize pre_exec hook. On Windows we use
# CommandExt::creation_flags instead (std, no extra dependency).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
