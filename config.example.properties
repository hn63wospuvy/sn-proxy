# sn-proxy configuration — properties format (key=value).
# Pass it with:  sn-proxy -c config.properties
# Lines starting with # or ! are comments. Command-line -p / -d override this.

# Web admin address — a bare port binds 0.0.0.0, or use HOST:PORT.
port=8080

# RocksDB data directory.
data_dir=data

# Run mode: daemon (default) runs in the background — the process re-spawns
# itself detached from the console, prints its pid (also written to
# <data_dir>/sn-proxy.pid) and returns immediately. Set mode=foreground to stay
# attached to the console (useful for development and `cargo run`). The -m /
# --mode command-line flag overrides this.
#mode=daemon

# Daily-rotated log file. Off by default (logs go to stdout). When set, logs are
# written to a file that rotates once a day (kept, never auto-deleted).
# A value ending in a path separator is a directory (prefix defaults to
# "sn-proxy", e.g. logs/sn-proxy.2026-06-26); otherwise the last path component
# is the filename prefix. NOTE: in daemon mode the console is detached, so set
# this if you want to keep the logs — without it, a daemon's logs are discarded.
#log_file=logs/
#log_file=/var/log/sn-proxy/proxy.log

# TLS certificate + private key (PEM) for the "https" proxy protocol.
# If omitted, a self-signed certificate is generated at startup.
#tls_cert=/etc/sn-proxy/cert.pem
#tls_key=/etc/sn-proxy/key.pem

# Web admin login. Configuring at least one admin enables sign-in;
# leave every admin setting unset to keep the admin open (no login).

# Single admin (shorthand). The password may be plaintext or an argon2 PHC hash
# ($argon2id$...); a hash is verified with argon2 at login. Plaintext is allowed
# but logs a warning at startup — prefer a hash.
#admin_user=admin
#admin_password=change-me
#admin_password=$argon2id$v=19$m=19456,t=2,p=1$c2FsdHNhbHQ$3hHj...   # (example hash)
# Optional — restrict this admin's login to a network range (CIDR):
#admin_network=192.168.1.0/24

# Multiple admins — admin.<NAME>.password, plus an optional
# admin.<NAME>.network CIDR. An admin with no network may sign in
# from anywhere; one with a network may only sign in from inside it.
#admin.alice.password=alice-secret
#admin.alice.network=10.0.0.0/8
#admin.bob.password=bob-secret
