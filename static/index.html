<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sn-proxy · SOCKS5 Admin</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --panel2: #1c2230; --border: #2a313c;
    --text: #c9d1d9; --muted: #8b949e; --accent: #3b82f6; --ok: #2ea043;
    --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .ws-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .spacer { flex: 1; }
  main { padding: 22px; max-width: 1200px; margin: 0 auto; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); padding: 7px 13px;
    border-radius: 6px; transition: .12s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.tiny { padding: 4px 9px; font-size: 12px; }
  .proxy {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 18px; overflow: hidden;
  }
  .proxy-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; background: var(--panel2);
  }
  .proxy-head .name { font-size: 15px; font-weight: 600; }
  .proxy-head .addr { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }
  .badge.run { background: rgba(46,160,67,.18); color: var(--ok); }
  .badge.stop { background: rgba(248,81,73,.16); color: var(--bad); }
  .badge.auth { background: rgba(210,153,34,.16); color: var(--warn); }
  .stats { display: flex; gap: 22px; padding: 12px 18px; flex-wrap: wrap; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 16px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 8px 18px; font-size: 13px;
    border-top: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  td.mono, th.mono { font-family: ui-monospace, monospace; }
  .empty { padding: 16px 18px; color: var(--muted); font-style: italic; }
  .conn-more { padding: 9px 18px; border-top: 1px solid var(--border); }
  .conn-more button { width: 100%; color: var(--accent); }
  .row-actions { display: flex; gap: 7px; }
  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; width: 480px; max-width: 92vw;
    max-height: 86vh; overflow: auto;
  }
  .modal h2 { padding: 16px 20px; font-size: 16px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 9px;
    padding: 14px 20px; border-top: 1px solid var(--border);
  }
  .err { color: var(--bad); font-size: 12px; min-height: 16px; }
  .hint { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>sn<span>·</span>proxy</h1>
  <span class="ws-status"><span class="dot" id="wsDot"></span><span id="wsText">connecting…</span></span>
  <div class="spacer"></div>
  <button class="primary" onclick="openForm()">+ New Proxy</button>
</header>
<main id="list"></main>

<!-- create / edit modal -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <h2 id="formTitle">New Proxy</h2>
    <div class="modal-body">
      <div><label>Name</label><input id="fName" placeholder="My proxy" /></div>
      <div>
        <label>Listen address</label>
        <input id="fAddr" placeholder="0.0.0.0:1080" />
        <div class="hint">host:port the SOCKS5 proxy binds to</div>
      </div>
      <div>
        <label>Username (optional — leave blank to disable auth)</label>
        <input id="fUser" placeholder="" autocomplete="off" />
      </div>
      <div><label>Password</label><input id="fPass" type="text" placeholder="" autocomplete="off" /></div>
      <div class="err" id="formErr"></div>
    </div>
    <div class="modal-foot">
      <button onclick="closeForm()">Cancel</button>
      <button class="primary" id="formSave" onclick="saveForm()">Create</button>
    </div>
  </div>
</div>

<!-- history modal -->
<div class="modal-bg" id="histModal">
  <div class="modal" style="width: 760px;">
    <h2 id="histTitle">Connection History</h2>
    <div class="modal-body" style="padding: 0;">
      <table>
        <thead><tr>
          <th class="mono">Source</th><th class="mono">Destination</th>
          <th>Sent</th><th>Received</th><th>Duration</th><th>Closed</th>
        </tr></thead>
        <tbody id="histBody"></tbody>
      </table>
      <div class="empty" id="histEmpty" style="display:none;">No closed connections recorded.</div>
    </div>
    <div class="modal-foot"><button onclick="closeHist()">Close</button></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let editId = null;          // proxy id being edited, null = create
let latest = [];            // last snapshot
const connsExpanded = new Set(); // proxy ids whose full connection list is shown
const CONN_COLLAPSE = 3;    // collapse active-connection tables longer than this

function fmtBytes(n) {
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"];
  let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 2 : 1) + " " + u[i];
}
function fmtDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}
function fmtTime(ms) { return new Date(ms).toLocaleString(); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---- rendering ----
function render(proxies) {
  latest = proxies;
  const now = Date.now();
  if (!proxies.length) {
    $("list").innerHTML = '<div class="empty">No proxies yet. Click “New Proxy” to create one.</div>';
    return;
  }
  $("list").innerHTML = proxies.map(p => {
    const conns = p.active_connections || [];
    const connsOpen = connsExpanded.has(p.id);
    const visibleConns = (conns.length > CONN_COLLAPSE && !connsOpen)
      ? conns.slice(0, CONN_COLLAPSE) : conns;
    const rows = visibleConns.map(c => `
      <tr>
        <td class="mono">${esc(c.src_addr)}</td>
        <td class="mono">${esc(c.dst_addr)}</td>
        <td>${fmtBytes(c.bytes_sent)}</td>
        <td>${fmtBytes(c.bytes_received)}</td>
        <td>${fmtDuration(now - c.started_at)}</td>
      </tr>`).join("");
    return `
    <div class="proxy">
      <div class="proxy-head">
        <span class="name">${esc(p.name)}</span>
        <span class="addr">${esc(p.listen_addr)}</span>
        <span class="badge ${p.running ? "run" : "stop"}">${p.running ? "RUNNING" : "STOPPED"}</span>
        ${p.auth_enabled ? `<span class="badge auth">AUTH: ${esc(p.auth_username || "")}</span>` : ""}
        <div class="spacer"></div>
        <div class="row-actions">
          ${p.running
            ? `<button class="tiny" onclick="act('${p.id}','stop')">Stop</button>`
            : `<button class="tiny primary" onclick="act('${p.id}','start')">Start</button>`}
          <button class="tiny" onclick="openHist('${p.id}','${esc(p.name)}')">History</button>
          <button class="tiny" onclick="editProxy('${p.id}')">Edit</button>
          <button class="tiny danger" onclick="delProxy('${p.id}','${esc(p.name)}')">Delete</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Active</div><div class="v">${conns.length}</div></div>
        <div class="stat"><div class="k">Total conns</div><div class="v">${p.total_connections}</div></div>
        <div class="stat"><div class="k">Sent</div><div class="v">${fmtBytes(p.bytes_sent)}</div></div>
        <div class="stat"><div class="k">Received</div><div class="v">${fmtBytes(p.bytes_received)}</div></div>
      </div>
      ${conns.length ? `
      <table>
        <thead><tr>
          <th class="mono">Source IP</th><th class="mono">Destination</th>
          <th>Sent</th><th>Received</th><th>Duration</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${conns.length > CONN_COLLAPSE ? `<div class="conn-more">
        <button class="tiny" onclick="toggleConns('${p.id}')">${connsOpen
          ? "▲ Thu gọn"
          : `▼ Xem tất cả ${conns.length} kết nối (còn ${conns.length - CONN_COLLAPSE} ẩn)`}</button>
      </div>` : ""}` : `<div class="empty">No active connections.</div>`}
    </div>`;
  }).join("");
}

// Toggle whether a proxy shows all active connections or just the first few.
function toggleConns(id) {
  if (connsExpanded.has(id)) connsExpanded.delete(id);
  else connsExpanded.add(id);
  render(latest);
}

// ---- websocket realtime feed ----
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $("wsDot").classList.add("live"); $("wsText").textContent = "live"; };
  ws.onclose = () => {
    $("wsDot").classList.remove("live"); $("wsText").textContent = "reconnecting…";
    setTimeout(connectWS, 1500);
  };
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "snapshot") render(msg.proxies);
    } catch (e) { console.error(e); }
  };
}

// ---- API actions ----
// Pull a fresh snapshot over REST so the UI updates immediately after a
// mutation, instead of waiting for the next 1s websocket snapshot.
async function refresh() {
  try { render(await fetch("/api/proxies").then(r => r.json())); } catch (e) {}
}
async function act(id, what) {
  await fetch(`/api/proxies/${id}/${what}`, { method: "POST" })
    .then(async r => { if (!r.ok) alert((await r.json()).error || "failed"); });
  refresh();
}
async function delProxy(id, name) {
  if (!confirm(`Delete proxy “${name}” and all its history?`)) return;
  await fetch(`/api/proxies/${id}`, { method: "DELETE" });
  refresh();
}

// ---- create / edit form ----
function openForm() {
  editId = null;
  $("formTitle").textContent = "New Proxy";
  $("formSave").textContent = "Create";
  $("fName").value = ""; $("fAddr").value = "0.0.0.0:1080";
  $("fUser").value = ""; $("fPass").value = ""; $("formErr").textContent = "";
  $("formModal").classList.add("show");
}
function editProxy(id) {
  const p = latest.find(x => x.id === id);
  if (!p) return;
  editId = id;
  $("formTitle").textContent = "Edit Proxy";
  $("formSave").textContent = "Save";
  $("fName").value = p.name; $("fAddr").value = p.listen_addr;
  $("fUser").value = p.auth_username || ""; $("fPass").value = "";
  $("formErr").textContent = p.auth_enabled ? "Re-enter the password to keep auth enabled." : "";
  $("formModal").classList.add("show");
}
function closeForm() { $("formModal").classList.remove("show"); }
async function saveForm() {
  const body = {
    name: $("fName").value.trim(),
    listen_addr: $("fAddr").value.trim(),
    auth: null,
  };
  const user = $("fUser").value.trim();
  if (user) body.auth = { username: user, password: $("fPass").value };
  if (!body.name || !body.listen_addr) {
    $("formErr").textContent = "Name and listen address are required."; return;
  }
  const url = editId ? `/api/proxies/${editId}` : "/api/proxies";
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (r.ok) { closeForm(); refresh(); }
  else $("formErr").textContent = (await r.json()).error || "request failed";
}

// ---- history ----
async function openHist(id, name) {
  $("histTitle").textContent = `History · ${name}`;
  $("histModal").classList.add("show");
  $("histBody").innerHTML = "";
  const recs = await fetch(`/api/proxies/${id}/history?limit=200`).then(r => r.json());
  if (!recs.length) {
    $("histEmpty").style.display = "block";
    return;
  }
  $("histEmpty").style.display = "none";
  $("histBody").innerHTML = recs.map(r => `
    <tr>
      <td class="mono">${esc(r.src_addr)}</td>
      <td class="mono">${esc(r.dst_addr)}</td>
      <td>${fmtBytes(r.bytes_sent)}</td>
      <td>${fmtBytes(r.bytes_received)}</td>
      <td>${r.closed_at ? fmtDuration(r.closed_at - r.started_at) : "—"}</td>
      <td>${r.closed_at ? fmtTime(r.closed_at) : "—"}</td>
    </tr>`).join("");
}
function closeHist() { $("histModal").classList.remove("show"); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeForm(); closeHist(); }
});
connectWS();
</script>
</body>
</html>
